services:
  app:
    build: .
    container_name: axiom-app
    ports: ["3100:3100"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://lumen:lumen@db:5432/lumen
      COURSES_ROOT: /courses
      DATA_DIR: /data
      APP_URL: ${APP_URL:-http://localhost:3100}
      # Cyber Range: orchestrator drives the host Docker daemon through the
      # socket to create per-instance isolated lab networks + targets.
      # The socket mount is for orchestration only — lab targets never get it.
      LAB_PROVIDER: ${LAB_PROVIDER:-docker}
      AXIOM_SELF_CONTAINER: axiom-app
    volumes:
      - ./courses:/courses:ro
      - appdata:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [db]
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  # Pre-builds the first lab target image into the shared daemon so lab
  # startup never waits on a build. Never started as a service.
  whois-vm1:
    build: ./lab-images/m6/whois-vm1
    image: axiom-lab-whois-vm1:latest
    profiles: [lab-images]
  whois-vm2:
    build: ./lab-images/m6/whois-vm2
    image: axiom-lab-whois-vm2:latest
    profiles: [lab-images]
  whois-vm3:
    build: ./lab-images/m6/whois-vm3
    image: axiom-lab-whois-vm3:latest
    profiles: [lab-images]
  # Student VPN gateway (optional WireGuard endpoint so personal Kali VMs can
  # reach their own lab targets directly). Harmless when VPN_ENABLED=0: it
  # carries no peers and forwards nothing. Requires UDP VPN_ENDPOINT_PORT
  # forwarded to this host + VPN_ENDPOINT_HOST set to a student-reachable IP.
  vpn:
    build: ./vpn-gateway
    container_name: axiom-vpn
    environment:
      VPN_SUBNET_BASE: ${VPN_SUBNET_BASE:-10.212}
      WG_PORT: ${VPN_ENDPOINT_PORT:-51820}
    ports: ["${VPN_ENDPOINT_PORT:-51820}:51820/udp"]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    volumes: [vpnconf:/config]
    restart: unless-stopped
volumes:
  pgdata:
  appdata:
  vpnconf:
